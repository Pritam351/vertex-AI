<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e59f8"/>
      <stop offset="100%" stop-color="#52d8c2"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0d9ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Inner glow -->
  <rect width="64" height="64" rx="14" ry="14" fill="rgba(255,255,255,0.08)"/>
  <!-- "V" letter -->
  <text
    x="32"
    y="47"
    font-family="Manrope, system-ui, -apple-system, sans-serif"
    font-size="40"
    font-weight="900"
    text-anchor="middle"
    fill="url(#vgrad)"
    letter-spacing="-1"
  >V</text>
</svg>

