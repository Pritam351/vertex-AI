<section class="view is-active" id="quizzes-view">
  <div class="section-intro">
    <p class="eyebrow">ASSESSMENTS</p>
    <h2>Quizzes & Practice</h2>
    <p>Test your retention, earn certificates, and challenge your understanding.</p>
  </div>

  <section aria-labelledby="attempts-heading">
    <div class="section-heading">
      <div>
        <p class="eyebrow">YOUR RECORD</p>
        <h3 id="attempts-heading">Recent Quiz Attempts</h3>
      </div>
      <span class="count-pill" id="attempts-count">0 attempts</span>
    </div>

    <div id="attempts-empty" class="empty-state">
      <div class="empty-icon" aria-hidden="true">◇</div>
      <h3>No quiz attempts yet</h3>
      <p>Enroll in a course and complete modules to unlock curriculum quizzes.</p>
      <a class="button button-secondary" href="#/student/dashboard">Go to My Courses</a>
    </div>

    <div id="attempts-list-container" class="courses-list-grid"></div>
  </section>
</section>
